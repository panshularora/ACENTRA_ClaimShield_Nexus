[project]
name = "claimshield"
version = "0.1.0"
description = "ClaimShield Nexus — SIU case platform for healthcare FWA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "httpx>=0.27",
  "structlog>=24.4",
  "pandas>=2.2",
  "numpy>=2.1",
  "faker>=33.0",
  "rapidfuzz>=3.10",
  "networkx>=3.4",
  "scikit-learn>=1.5",
  "pandera>=0.21",
  "python-multipart>=0.0.17",
  "email-validator>=2.2",
  "orjson>=3.10",
]

[project.scripts]
claimshield = "claimshield.cli:main"

[project.optional-dependencies]
ml = [
  "lightgbm>=4.5",
  "shap>=0.46",
  "pyod>=2.0",
]
aws = [
  "boto3>=1.35",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.119",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimshield"]

[tool.hatch.build.targets.sdist]
include = ["src/claimshield", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]
# Display copy uses the multiplication sign and en dash on purpose ("×8 referrals", "1–4").
allowed-confusables = ["×", "–"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares dependencies as call defaults (Depends(require("perm")), Query(...)); they are
# evaluated per request, which is what B008 warns about for ordinary functions.
"src/claimshield/api/**" = ["B008"]
"tests/**" = ["S105", "S106", "S311"]
"src/claimshield/synth/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["claimshield"]

# pandas, networkx, scikit-learn and boto3 ship without type information. pandas-stubs and
# types-networkx report thousands of false positives on DataFrame indexing, so
# these modules are treated as Any at the boundary and typed on our side.
[[tool.mypy.overrides]]
module = ["pandas.*", "networkx.*", "sklearn.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
